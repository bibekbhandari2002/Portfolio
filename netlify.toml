# Netlify Configuration with Production-Grade Security Hardening
# For Cybersecurity-Focused Portfolio Website
# Last Updated: May 2026

[build]
  command = "npm run build"
  publish = "dist"

# Redirect all HTTP to HTTPS (enforced via security headers)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Cache configuration for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Cache configuration for the main HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# All other static files
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

################################
# SECURITY HEADERS - CRITICAL
################################

# Apply security headers to all responses (default)
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: Preload-ready configuration
    # Forces HTTPS for current domain and all subdomains for 1 year
    # includeSubDomains ensures all subdomains use HTTPS
    # preload allows inclusion in browser HSTS preload lists
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # X-Frame-Options: Prevents clickjacking by controlling how the page can be embedded
    # DENY: Page cannot be displayed in a frame, regardless of origin
    X-Frame-Options = "DENY"

    # X-Content-Type-Options: Prevents MIME-type sniffing attacks
    # nosniff: Browser must respect the Content-Type header
    X-Content-Type-Options = "nosniff"

    # Referrer-Policy: Controls what referrer information is sent
    # strict-no-referrer: No referrer info sent to any origin
    # - Protects user privacy
    # - Prevents sensitive URLs in logs of external sites
    # - Acceptable for a portfolio with no sensitive data leakage
    Referrer-Policy = "strict-no-referrer"

    # Permissions-Policy (formerly Feature-Policy)
    # Granularly controls which browser features and APIs the page can use
    # Applies to the page and all embedded iframes
    # 
    # Disabled by default (explicitly set to empty/none):
    # - accelerometer: Device motion sensing
    # - ambient-light-sensor: Light sensor access
    # - autoplay: Auto-playing media
    # - battery: Battery information API (deprecated)
    # - camera: Webcam access
    # - display-capture: Screen/window capture
    # - document-domain: Document.domain modification
    # - encrypted-media: EME (encrypted media extensions)
    # - fullscreen: Fullscreen API
    # - geolocation: Geolocation API
    # - gyroscope: Device orientation
    # - magnetometer: Device compass
    # - microphone: Audio input
    # - midi: MIDI input/output
    # - payment: Payment Request API
    # - picture-in-picture: PiP video mode
    # - sync-xhr: Synchronous XHRs (already deprecated)
    # - usb: WebUSB API
    # - xr-spatial-tracking: WebXR spatial tracking
    #
    # self: Only for same-origin frames
    # *: Policy applies to all origins
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), sync-xhr=(), usb=(), xr-spatial-tracking=()"

    # Content-Security-Policy: Mitigates XSS and injection attacks
    # Controls which resources the browser can load and execute
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://api.emailjs.com https://cdn.jsdelivr.net; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content"

    # Additional security headers

    # X-UA-Compatible: Forces latest IE rendering mode (for legacy browser support)
    # Ensures older IE versions use their latest rendering engine
    X-UA-Compatible = "IE=edge"

    # Cross-Origin-Embedder-Policy: Enables cross-origin isolation
    # - Prevents other sites from embedding this page without explicit permission
    # - require-corp: Require CORP headers for all resources
    Cross-Origin-Embedder-Policy = "require-corp"

    # Cross-Origin-Opener-Policy: Isolates window from other origins
    # - same-origin: Only documents from the same origin can open this window
    # - Protects against Spectre-like attacks
    Cross-Origin-Opener-Policy = "same-origin"

    # Cross-Origin-Resource-Policy: Controls cross-origin resource sharing
    # - same-origin: Only same-origin requests can access resources
    Cross-Origin-Resource-Policy = "same-origin"

    # X-Permitted-Cross-Domain-Policies: Controls Flash cross-domain requests (legacy)
    X-Permitted-Cross-Domain-Policies = "none"

    # X-XSS-Protection: Legacy browser XSS protection (for older browsers)
    # - 1; mode=block: Enable XSS protection and block if XSS detected
    X-XSS-Protection = "1; mode=block"

    # Expect-CT: Certificate Transparency enforcement (legacy)
    # - max-age=86400: Require valid CT logs for 1 day
    # - enforce: Block connections without valid CT
    # Note: Modern browsers enforce this by default, included for completeness
    Expect-CT = "max-age=86400, enforce"

    # Server header removal (handled by Netlify, but documented here)
    # - We want to avoid revealing server information
    # This is typically handled at the server level

################################
# SECURITY HEADERS - SPA ROUTING
################################

# Enable SPA routing for React Router
# Ensure all route requests serve index.html without redirecting
# This is critical for React SPA functionality
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    # Same security headers as above
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-no-referrer"
    Permissions-Policy = "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), sync-xhr=(), usb=(), xr-spatial-tracking=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://api.emailjs.com https://cdn.jsdelivr.net; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content"
    X-UA-Compatible = "IE=edge"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    X-XSS-Protection = "1; mode=block"
    Expect-CT = "max-age=86400, enforce"

# 404 Handling for SPA
[[redirects]]
  from = "/*"
  to = "/404"
  force = false
  status = 404